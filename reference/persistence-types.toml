# ============================================================
# Persistence Types
# se-theory-persistence
# ============================================================
# Public Lean types for the Persistence theory.

schema = "se-type-registry-1"
kind = "type"
repo = "se-theory-persistence"
surface_module = "SE.Persistence"
namespace = "SE.Persistence"

[type.Classification]
order = 1
id = "Classification"
cite_id = "PS.TYPE.CLASSIFICATION"
name = "Classification"
lean_symbol = "SE.Persistence.Classification"
lean_kind = "structure"
source_module = "SE.Persistence.Domain.Classification"
description = "A persistence classification over the transformation domain T. pattern t is the applicability-and-class pair for t. persist is the declared persistence set. Its relation to the preserving transformations is the predicate Classification.WellFormed, stated separately rather than carried as a field."

[type.ClassificationValue]
order = 2
id = "ClassificationValue"
cite_id = "PS.TYPE.CLASSIFICATION_VALUE"
name = "Classification value"
lean_symbol = "SE.Persistence.ClassificationValue"
lean_kind = "inductive"
source_module = "SE.Persistence.Domain.ClassificationValue"
description = "Identity-persistence classification of an applicable transformation relative to one criterion of identity. - ign: applicable and identity-ignoring (written IGN in the papers, and NEU in SE-200). - prs: applicable and identity-preserving. - brk: applicable and identity-breaking. Inapplicable (N/A) is deliberately not a constructor; see SE.Persistence.Classification."

[type.Dynamics]
order = 3
id = "Dynamics"
cite_id = "PS.TYPE.DYNAMICS"
name = "Dynamics"
lean_symbol = "SE.Persistence.Dynamics"
lean_kind = "structure"
source_module = "SE.Persistence.Relation.Generated"
description = "How each transformation relates states of a carrier C: step t x y means y is a result of applying t to x."

[type.Reach]
order = 4
id = "Reach"
cite_id = "PS.TYPE.REACH"
name = "Reach"
lean_symbol = "SE.Persistence.Reach"
lean_kind = "inductive"
source_module = "SE.Persistence.Relation.Generated"
description = "The reflexive-transitive closure of r, from a fixed start x."

[type.Generated]
order = 5
id = "Generated"
cite_id = "PS.TYPE.GENERATED"
name = "Generated"
lean_symbol = "SE.Persistence.Generated"
lean_kind = "inductive"
source_module = "SE.Persistence.Relation.Generated"
description = "The equivalence relation generated by r."
