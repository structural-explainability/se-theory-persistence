# ============================================================
# lakefile.toml
# ============================================================
# Declares the public Lean package identity, import surface,
# build targets, dependencies, and verification executables.

# Run with:
# lake build
# lake test
# lake lint

# ============================================================
# PROJECT IDENTITY
# ============================================================

name = "se-theory-persistence"
version = "0.1.0"
license = "MIT"


# ============================================================
# BUILD SURFACE
# ============================================================
# defaultTargets must include the public Lean library root.

defaultTargets = ["SE.Persistence"]
testDriver = "SETest"
lintDriver = "SELint"

[[require]]
name = "se-theory-transformation"
git = "https://github.com/structural-explainability/se-theory-transformation"
rev = "main"


# ============================================================
# LEAN OPTIONS
# ============================================================

[leanOptions]
weak.linter.mathlibStandardSet = true
weak.linter.flexible = true
weak.linter.style.header = false
weak.linter.style.longLine = false

# These linters are included in Mathlib's standard set but do
# not currently operate correctly in downstream projects.
weak.linter.pythonStyle = false
weak.linter.checkInitImports = false
weak.linter.allScriptsDocumented = false

# This linter is not extensible for Unicode outside Mathlib's set.
weak.linter.unicodeLinter = false

# ============================================================
# DEPENDENCIES
# ============================================================
# Mathlib provides standard infrastructure used by this library.
# Mathlib release must match the Lean version in lean-toolchain.

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.32.1"

# ============================================================
# PUBLIC LIBRARY
# ============================================================
# The library downstream packages import. It must list every module
# family this package owns under SE/. A module matched by no glob is not
# built: a clean build fails, or the lint executable fails at link time with
# undefined symbols. Tests (SETest) and the lint driver (SELint) are separate
# targets.
#
# Do not use "SE.*". Other packages own other SE.* families
# (for example SE.Transformation); claiming them breaks any package
# that requires both.
#
# Glob forms:
#   "A.B"    only the module A.B itself (here: "SE", the entry point SE.lean)
#   "A.B.*"  A.B and all its submodules (use when A/B.lean exists)
#   "A.B.+"  submodules of A.B only, not A.B itself (use for a directory
#            with no A/B.lean)
#
# To add a family under SE/, add "SE.<Family>.+" (or ".*" if SE/<Family>.lean
# exists).

[[lean_lib]]
name = "SE.Persistence"
roots = ["SE.Persistence"]
globs = ["SE", "SE.Persistence.*"]
# Lake supports .* for the named module plus all its submodules.



# ============================================================
# TEST LIBRARY
# ============================================================
# Internal verification; not part of downstream public import surface.

[[lean_lib]]
name = "SETest"
roots = ["SETest.Persistence"]
globs = ["SETest", "SETest.Persistence.*"]
leanOptions = { weak.linter.style.header = false }


# ============================================================
# LINT DRIVER
# ============================================================

[[lean_exe]]
name = "SELint"
root = "SELint"
leanOptions = { Elab.inServer = true }
